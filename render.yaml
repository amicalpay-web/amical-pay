# Amical Pay Render Blueprint Configuration

version: "1"

projects:
  - name: Amical-pay
    environments:
      - name: amicalpay-web / amical-pay
        services:
          - type: web
            name: amical-pay-api
            runtime: node
            repo: https://github.com/amicalpay-web/amical-pay
            plan: free
            region: oregon
            rootDir: backend
            buildCommand: npm install && npm run build
            startCommand: npm start
            healthCheckPath: /healthz
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: production
              - key: FAZER_API_KEY
                sync: false
              - key: FRONTEND_URL
                value: https://amical-pay-frontend.onrender.com
              - key: LOG_LEVEL
                value: info
          - type: web
            name: amical-pay-frontend
            runtime: node
            repo: https://github.com/amicalpay-web/amical-pay
            plan: free
            region: oregon
            buildCommand: npm install && npm run build
            startCommand: npm run preview
            healthCheckPath: /
            autoDeployTrigger: commit
            envVars:
              - key: VITE_API_URL
                value: https://amical-pay-api.onrender.com
