services:
  # Backend API - Node.js/Express
  - type: web
    name: amical-pay-api
    env: node
    branch: main
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FAZER_API_KEY
        fromSecret: FAZER_API_KEY
      - key: ADMIN_TOKEN
        fromSecret: ADMIN_TOKEN
      - key: FRONTEND_URL
        value: https://amical-pay-frontend.onrender.com
      - key: LOG_LEVEL
        value: info
