# Amical Pay - Render Blueprint
# Frontend + Backend in one repository
version: "1"

projects:
  - name: AmicalPay
    environments:
      - name: Production
        services:
          # Backend API
          - type: web
            name: amical-pay-api
            runtime: node
            repo: https://github.com/amicalpay-web/amical-pay
            plan: free
            region: oregon
            rootDir: backend
            domains:
              - api.amicalpay.com
            buildCommand: npm install --no-audit --no-fund && npm run build
            startCommand: npm start
            healthCheckPath: /healthz
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: production
              - key: LOG_LEVEL
                value: info
              - key: FAZER_API_KEY
                sync: false
              - key: FAZER_API_BASE_URL
                value: https://api.fzr.cards/api/v2
              - key: ADMIN_TOKEN
                generateValue: true
              - key: FRONTEND_URL
                value: https://amicalpay.com,https://www.amicalpay.com
              - key: MONCASH_MODE
                value: sandbox
              - key: MONCASH_CLIENT_ID
                sync: false
              - key: MONCASH_SECRET_KEY
                sync: false
              - key: MONCASH_API_BASE_URL
                value: https://sandbox.moncashbutton.digicelgroup.com/Api
              - key: MONCASH_GATEWAY_BASE_URL
                value: https://sandbox.moncashbutton.digicelgroup.com/Moncash-middleware
              - key: MONCASH_RETURN_URL
                value: https://api.amicalpay.com/api/webhook/moncash
              - key: MONCASH_ALERT_URL
                value: https://amicalpay.com/payment-success
              - key: SUPABASE_URL
                sync: false
              - key: SUPABASE_ANON_KEY
                sync: false
              - key: SUPABASE_SERVICE_ROLE_KEY
                sync: false

          # Frontend application
          - type: web
            name: amical-pay-frontend
            runtime: node
            repo: https://github.com/amicalpay-web/amical-pay
            plan: free
            region: oregon
            rootDir: .
            domains:
              - amicalpay.com
              - www.amicalpay.com
            buildCommand: npm install --no-audit --no-fund && npm run build
            startCommand: npm start
            healthCheckPath: /
            autoDeployTrigger: commit
            envVars:
              - key: VITE_API_URL
                value: https://api.amicalpay.com
              - key: VITE_SUPABASE_URL
                sync: false
              - key: VITE_SUPABASE_ANON_KEY
                sync: false
