# Amical Pay - Render Blueprint
# Frontend + Backend in one repository
version: "1"

projects:
  - name: AmicalPay
    environments:
      - name: Production
        services:
          # Backend API
          - type: web
            name: amical-pay-api
            runtime: node
            repo: https://github.com/amicalpay-web/amical-pay
            plan: free
            region: oregon
            rootDir: backend
            buildCommand: npm install && npm run build
            startCommand: npm start
            healthCheckPath: /healthz
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: production
              - key: LOG_LEVEL
                value: info
              - key: FAZER_API_KEY
                sync: false
              - key: ADMIN_TOKEN
                generateValue: true
              - key: FRONTEND_URL
                value: https://amical-pay-frontend.onrender.com

          # Frontend application
          - type: web
            name: amical-pay-frontend
            runtime: node
            repo: https://github.com/amicalpay-web/amical-pay
            plan: free
            region: oregon
            buildCommand: npm install && npm run build
            startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
            healthCheckPath: /
            autoDeployTrigger: commit
            envVars:
              - key: VITE_API_URL
                value: https://amical-pay-api.onrender.com
